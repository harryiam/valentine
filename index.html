<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff6b9d 0%, #c44569 30%, #ff8fab 60%, #ff4d7d 100%);
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Floating hearts background */
  .bg-hearts {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .bg-heart {
    position: absolute;
    font-size: 1.5rem;
    animation: floatUp linear infinite;
    opacity: 0.3;
  }

  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0.3; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 32px;
    padding: 60px 60px 50px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(150, 20, 60, 0.4), inset 0 1px 0 rgba(255,255,255,0.6);
    animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes cardIn {
    from { transform: scale(0.7) translateY(40px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .bear {
    font-size: 5rem;
    display: block;
    animation: bearBounce 2s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
  }

  @keyframes bearBounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }

  h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3.2rem;
    color: #fff;
    text-shadow: 0 2px 10px rgba(150,20,60,0.4);
    margin: 16px 0 8px;
    line-height: 1.2;
  }

  .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 1.05rem;
    margin-bottom: 36px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .btn-group {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-yes {
    background: linear-gradient(135deg, #ff4d7d, #c44569);
    color: white;
    border: none;
    padding: 16px 44px;
    border-radius: 50px;
    font-size: 1.2rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(196,69,105,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-yes:hover {
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 10px 28px rgba(196,69,105,0.6);
  }

  .btn-yes:active {
    transform: scale(0.96);
  }

  .btn-no {
    background: rgba(255,255,255,0.25);
    color: white;
    border: 2px solid rgba(255,255,255,0.6);
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 1.1rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    position: fixed;
    letter-spacing: 0.5px;
  }

  /* Yes screen */
  .yes-screen {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 100;
    background: linear-gradient(135deg, #ff4d7d, #ff8fab, #c44569);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
  }

  .yes-screen.active {
    display: flex;
    animation: fadeInScale 0.5s ease forwards;
  }

  @keyframes fadeInScale {
    from { opacity: 0; transform: scale(1.1); }
    to { opacity: 1; transform: scale(1); }
  }

  .yes-screen h2 {
    font-family: 'Great Vibes', cursive;
    font-size: 4rem;
    color: white;
    text-shadow: 0 4px 15px rgba(100,0,40,0.3);
    margin-bottom: 10px;
  }

  .yes-screen p {
    font-size: 1.2rem;
    color: rgba(255,255,255,0.9);
    font-weight: 600;
    margin-bottom: 30px;
  }

  .big-heart {
    font-size: 6rem;
    animation: heartbeat 0.8s ease-in-out infinite;
    display: block;
    margin-bottom: 20px;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(1.05); }
    75% { transform: scale(1.2); }
  }

  /* Emoji burst */
  .emoji-burst {
    position: fixed;
    pointer-events: none;
    font-size: 2rem;
    z-index: 200;
    animation: burst 1.2s ease-out forwards;
  }

  @keyframes burst {
    0% { transform: translate(0,0) scale(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(var(--rot)); opacity: 0; }
  }

  .confetti-heart {
    position: fixed;
    pointer-events: none;
    font-size: 1.8rem;
    z-index: 150;
    animation: confettiFall 2s ease-in forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
  }

  .no-count-msg {
    color: rgba(255,255,255,0.7);
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 20px;
    transition: opacity 0.3s;
  }
</style>
</head>
<body>

<!-- Floating background hearts -->
<div class="bg-hearts" id="bgHearts"></div>

<!-- Main card -->
<div class="card" id="mainCard">
  <span class="bear">🐻</span>
  <h1>Will You Be My Valentine?</h1>
  <p class="subtitle">💌 My heart is waiting for your answer... 💌</p>
  <div class="btn-group">
    <button class="btn-yes" onclick="sayYes()">Yes! 💕</button>
    <button class="btn-no" id="noBtn" onmouseover="runAway(event)" ontouchstart="runAway(event)">No 😢</button>
  </div>
  <p class="no-count-msg" id="noMsg"></p>
</div>

<!-- Yes screen -->
<div class="yes-screen" id="yesScreen">
  <span class="big-heart">❤️</span>
  <h2>Yay! I knew it!</h2>
  <p>You just made me the happiest ever! 🥰</p>
  <p style="font-size:2rem;">💕💖💝💘💗</p>
</div>

<script>
  // Generate background floating hearts
  const bgHearts = document.getElementById('bgHearts');
  const heartEmojis = ['❤️','💕','💖','💗','💝','💓','🌸','✨'];
  for (let i = 0; i < 25; i++) {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
    h.style.animationDuration = (Math.random() * 8 + 6) + 's';
    h.style.animationDelay = (Math.random() * 8) + 's';
    bgHearts.appendChild(h);
  }

  // Position No button inside card initially
  const noBtn = document.getElementById('noBtn');
  let noClickCount = 0;
  let positioned = false;

  function positionNoBtnInCard() {
    if (!positioned) {
      const card = document.getElementById('mainCard');
      const rect = card.getBoundingClientRect();
      noBtn.style.left = (rect.left + rect.width/2 + 20) + 'px';
      noBtn.style.top = (rect.top + 310) + 'px';
      positioned = true;
    }
  }

  window.addEventListener('load', positionNoBtnInCard);
  window.addEventListener('resize', () => { positioned = false; positionNoBtnInCard(); });

  const msgs = [
    "It'll run forever! 😂",
    "Still running... 🏃",
    "You can't catch it! 💨",
    "Try harder! 😝",
    "Nope! Pick YES! 💕",
    "It's too shy! 🙈",
    "Just say YES! 🥺",
    "Pretty please? 🌹"
  ];

  function runAway(e) {
    e.preventDefault();
    noClickCount++;
    const noMsg = document.getElementById('noMsg');
    noMsg.textContent = msgs[Math.min(noClickCount - 1, msgs.length - 1)];

    const margin = 20;
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;
    const maxX = window.innerWidth - btnW - margin;
    const maxY = window.innerHeight - btnH - margin;

    const newX = Math.random() * maxX + margin;
    const newY = Math.random() * maxY + margin;

    noBtn.style.transition = 'left 0.2s cubic-bezier(0.34,1.56,0.64,1), top 0.2s cubic-bezier(0.34,1.56,0.64,1)';
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
  }

  function sayYes() {
    // Burst emojis from center
    const burstEmojis = ['❤️','💕','💖','💗','💝','💘','🌸','✨','🥰','😍','💋','🌹'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    for (let i = 0; i < 30; i++) {
      const el = document.createElement('div');
      el.className = 'emoji-burst';
      el.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      const angle = Math.random() * 360;
      const dist = Math.random() * 250 + 80;
      el.style.setProperty('--dx', Math.cos(angle * Math.PI/180) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(angle * Math.PI/180) * dist + 'px');
      el.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }

    // Confetti hearts falling
    setTimeout(() => {
      for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-heart';
        el.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-50px';
        el.style.animationDelay = (Math.random() * 1.5) + 's';
        el.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }
    }, 300);

    setTimeout(() => {
      document.getElementById('yesScreen').classList.add('active');
    }, 400);
  }
</script>
</body>
</html>
